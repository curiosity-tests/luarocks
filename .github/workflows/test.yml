name: test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs"
      - "**/*.md"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - "docs"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  ##############################################################################
  ShellLint:
    runs-on: "ubuntu-latest"

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Prep
      run: |
        sudo apt-get install -y shellcheck

    - name: Shellcheck
      run: |
        shellcheck ./configure

  ##############################################################################
  TestMatrix:
    strategy:
      fail-fast: false
      matrix:
        lua-version: ["5.4", "luajit-2.1"]
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: ${{ matrix.lua-version }}

    - uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7
      with:
        luaRocksVersion: "3.13.0"

    - name: 'Setup macOS deps'
      if: runner.os == 'macOS'
      run: brew install openssl bzip2

    - name: 'Setup Ubuntu deps'
      if: runner.os == 'Linux'
      run: sudo apt-get install libbz2-dev

    - name: Prep
      run: |
        luarocks install compat53
        luarocks install busted
        luarocks install cluacov
        luarocks install busted-htest

    - name: Unit Test
      run: |
        busted -o htest --exclude-tags=git,integration --verbose -Xhelper "lua_dir=$(luarocks config variables.LUA_DIR),ci"
        busted -o htest --exclude-tags=git,integration --verbose -Xhelper "lua_dir=$(luarocks config variables.LUA_DIR),ci,env=full"

    - name: Integration Test
      run: |
        busted -o htest --exclude-tags=ssh,gpg,git,unit,quick --verbose -Xhelper "lua_dir=$(luarocks config variables.LUA_DIR),ci"
        busted -o htest --exclude-tags=ssh,gpg,git,unit,quick --verbose -Xhelper "lua_dir=$(luarocks config variables.LUA_DIR),ci,env=full"

    - name: Generate Coverage Report
      run: luacov -c "testrun/luacov.config"

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install Codecov
      run: pip install codecov

    - name: Upload Coverage Report
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: codecov -t "$CODECOV_TOKEN" -f "testrun/luacov.report.out" -X gcov

  ##############################################################################
  SmokeTest:
    runs-on: "ubuntu-latest"
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: "5.4"

    - name: Smoke Test
      run: |
        ./configure
        ./makedist dev $(dirname $(dirname $(which lua)))
        ./smoke_test.sh luarocks-dev.tar.gz

  ##############################################################################
  BinaryBuild:
    runs-on: "ubuntu-latest"
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: "5.4"

    - name: 'Setup Ubuntu deps'
      run: sudo apt-get install libbz2-dev

    - name: Binary Build Smoke Test
      run: |
        ./configure
        ./makedist dev $(dirname $(dirname $(which lua)))
        ./smoke_test.sh luarocks-dev.tar.gz binary

  ##############################################################################
  WindowsBinaryBuild:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gcc-mingw-w64-i686-posix
            make-target: windows-binary-32
            mingw-sysroot: /usr/i686-w64-mingw32

          - package: gcc-mingw-w64-x86-64-posix
            make-target: windows-binary-64
            mingw-sysroot: /usr/x86_64-w64-mingw32

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false

    # [!NOTE]:
    #
    # During tests, the exact same
    # job (WindowsBinaryBuild)
    # fails to build the cross compiler
    # whenever we use Lua 5.4 provided
    # by the packages `lua5.4 liblua5.4-dev`
    # on Debian-based distros.
    #
    # On the other hand, installing Lua 5.4
    # from source, as happens applying
    # the `luarocks/gh-actions-lua`
    # action below, everything runs as
    # it should.
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: 5.4

    - name: Install cross compiler
      run: sudo apt install ${{ matrix.package }}

    - name: Configure LuaRocks to build the cross compiled binaries
      run: ./configure "--with-lua=${{ github.workspace }}/.lua"

    - name: Cross compile `luarocks.exe` and `luarocks-admin.exe`
      run: make "MINGW_SYSROOT=${{ matrix.mingw-sysroot }}" ${{ matrix.make-target }}

  ##############################################################################
